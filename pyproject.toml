[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "annotatoriq-data-quality-ops"
version = "2.0.0"
description = "Enterprise AI Training Data Quality Operations, Defect Detection, Agreement Analytics & Adjudication Governance Platform."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Munir", email = "master72o@users.noreply.github.com" }
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.0.0",
    "statsmodels>=0.13.0",
    "pyyaml>=6.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
annotatoriq = "annotatoriq.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["annotatoriq*", "quality_lab*"]
